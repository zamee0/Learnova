<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details — Learnova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/dashboard.html" class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i> Learnova</a>
      </div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline" style="width:100%;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
          <h1 class="topbar-title">Course Details</h1>
        </div>
        <div class="topbar-right">
          <div class="user-profile-badge">
            <div class="avatar current-user-avatar"></div>
            <div class="user-info-text">
              <span class="user-name current-user-name"></span>
              <span class="user-role-badge current-user-role"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="content-body">
        <div class="card" id="courseDetails" style="margin-bottom:2rem;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
            <div>
              <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
                <span class="badge badge-primary" id="courseCategory"></span>
                <span class="badge badge-info" id="courseLevel"></span>
              </div>
              <h2 id="courseTitle" style="font-size:1.75rem; font-weight:700;"></h2>
              <p style="color:var(--gray-500); font-size:0.9rem; margin-top:0.25rem;">
                Instructor: <strong id="courseTeacher" style="color:var(--gray-900);"></strong>
              </p>
            </div>
            <button id="enrollBtn" class="btn btn-primary" style="display:none;"><i class="fa-solid fa-plus"></i> Enroll Now</button>
          </div>
          <p id="courseDesc" style="color:var(--gray-700); line-height:1.6;"></p>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
          <div>
            <h3 style="font-size:1.25rem; font-weight:600; margin-bottom:1rem;"><i class="fa-solid fa-bullhorn"></i> Announcements</h3>
            <div id="announcementsList"></div>
          </div>

          <div>
            <h3 style="font-size:1.25rem; font-weight:600; margin-bottom:1rem;"><i class="fa-solid fa-comments"></i> Q&A Discussions</h3>
            <div class="card" style="margin-bottom:1.5rem;">
              <h4 style="font-size:0.95rem; font-weight:600; margin-bottom:0.75rem;">Ask a Question / Start Discussion</h4>
              <form id="newDiscussionForm">
                <div class="form-group">
                  <input type="text" id="discussionTitle" class="form-control" placeholder="Discussion title..." required>
                </div>
                <div class="form-group">
                  <textarea id="discussionContent" class="form-control" rows="3" placeholder="Describe your question in detail..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Post Discussion</button>
              </form>
            </div>
            <div id="discussionsList"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/course.js"></script>
</body>
</html>
