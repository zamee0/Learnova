<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Discussions & Q&A — Learnova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/dashboard.html" class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i> Learnova</a>
      </div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline" style="width:100%;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
          <h1 class="topbar-title">Course Discussions & Q&A</h1>
        </div>
        <div class="topbar-right">
          <div class="user-profile-badge">
            <div class="avatar current-user-avatar"></div>
            <div class="user-info-text">
              <span class="user-name current-user-name"></span>
              <span class="user-role-badge current-user-role"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="content-body" style="max-width:980px; margin:0 auto;">
        <div class="card" style="margin-bottom:2rem;">
          <h3 style="font-size:1.15rem; font-weight:600; margin-bottom:1rem;"><i class="fa-solid fa-pen-to-square"></i> Ask a Question / Start a Discussion</h3>
          <form id="discussionHubForm">
            <div class="form-group">
              <label class="form-label" for="discussionCourseSelect">Select Your Course</label>
              <select id="discussionCourseSelect" class="form-select" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="hubDiscTitle">Title</label>
              <input type="text" id="hubDiscTitle" class="form-control" placeholder="What is your question or topic?" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="hubDiscContent">Detailed Question / Content</label>
              <textarea id="hubDiscContent" class="form-control" rows="3" placeholder="Provide background context or code snippet..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Post Discussion</button>
          </form>
        </div>

        <h3 style="font-size:1.2rem; font-weight:600; margin-bottom:1rem;">Active Discussions Across Your Courses</h3>
        <div id="discussionsFeed"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/discussions.js"></script>
</body>
</html>
