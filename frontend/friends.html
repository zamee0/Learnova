<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends & Network — Learnova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/dashboard.html" class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i> Learnova</a>
      </div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline" style="width:100%;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
          <h1 class="topbar-title">Friends & Study Network</h1>
        </div>
        <div class="topbar-right">
          <div class="user-profile-badge">
            <div class="avatar current-user-avatar"></div>
            <div class="user-info-text">
              <span class="user-name current-user-name"></span>
              <span class="user-role-badge current-user-role"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="content-body" style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
        <div>
          <div class="card" style="margin-bottom:1.5rem;"><h3><i class="fa-solid fa-user-plus"></i> Community</h3><input id="communitySearch" class="form-control" placeholder="Search people by name or role..." oninput="searchCommunity(this.value)"><div id="communityResults" style="margin-top:1rem"></div></div>
          <h3 style="font-size:1.1rem; font-weight:600; margin-bottom:1rem;"><i class="fa-solid fa-users"></i> Current Friends</h3>
          <div id="friendsList"></div>
        </div>

        <div>
          <h3 style="font-size:1.1rem; font-weight:600; margin-bottom:1rem;"><i class="fa-solid fa-clock"></i> Friend Requests</h3>
          <div id="requestsList"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/friends.js"></script>
</body>
</html>
