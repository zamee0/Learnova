<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Courses — Learnova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/dashboard.html" class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i> Learnova</a>
      </div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
      <div class="sidebar-footer">
        <button class="btn btn-outline" style="width:100%;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
          <h1 class="topbar-title">Browse Courses</h1>
        </div>
        <div class="topbar-right">
          <div class="user-profile-badge">
            <div class="avatar current-user-avatar"></div>
            <div class="user-info-text">
              <span class="user-name current-user-name"></span>
              <span class="user-role-badge current-user-role"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="content-body">
        <div class="card" style="margin-bottom:2rem; padding:1.25rem;">
          <div style="display:flex; flex-wrap:wrap; gap:1rem;">
            <input type="text" id="searchInput" class="form-control" placeholder="Search courses by title or keyword..." style="flex:2; min-width:240px;">
            <select id="categoryFilter" class="form-select" style="flex:1; min-width:160px;">
              <option value="">All Categories</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Design">Design</option>
              <option value="Business">Business</option>
              <option value="Mathematics">Mathematics</option>
            </select>
            <select id="levelFilter" class="form-select" style="flex:1; min-width:160px;">
              <option value="">All Levels</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </div>
        </div>

        <div class="courses-grid" id="coursesGrid"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/courses.js"></script>
</body>
</html>
