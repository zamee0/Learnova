<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Learnova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo"><i class="fa-solid fa-graduation-cap"></i> Learnova</a>
        <p class="auth-subtitle">Create a new account to start learning</p>
      </div>

      <div id="authAlert" style="display:none;"></div>

      <form id="signupForm">
        <div style="display:flex; gap:1rem;">
          <div class="form-group" style="flex:1;">
            <label class="form-label" for="first_name">First Name</label>
            <input type="text" id="first_name" class="form-control" placeholder="John" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label" for="last_name">Last Name</label>
            <input type="text" id="last_name" class="form-control" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">I am joining as a</label>
          <select id="role" class="form-select">
            <option value="student">Student</option>
            <option value="teacher">Teacher / Instructor</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
