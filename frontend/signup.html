<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Learnova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:580px;">
      <div class="auth-header">
        <a href="/" class="auth-logo"><i class="fa-solid fa-graduation-cap"></i> Learnova</a>
        <p class="auth-subtitle">Create your academic account with optional profile details</p>
      </div>

      <div id="authAlert" style="display:none;"></div>

      <form id="signupForm">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">First Name *</label>
            <input type="text" id="first_name" class="form-control" placeholder="John" required>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name *</label>
            <input type="text" id="last_name" class="form-control" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="name@learnova.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label">Account Role *</label>
          <select id="role" class="form-select" onchange="toggleRoleFields(this.value)">
            <option value="student">Student</option>
            <option value="teacher">Teacher / Instructor</option>
          </select>
        </div>

        <!-- Optional Profile Picture & Bio -->
        <div class="form-group">
          <label class="form-label">Avatar Image URL (Optional)</label>
          <input type="url" id="avatar_url" class="form-control" placeholder="https://example.com/photo.jpg">
        </div>

        <div class="form-group">
          <label class="form-label">Bio <span id="teacherRequiredMark"></span></label>
          <textarea id="bio" class="form-control" rows="2" placeholder="Tell the community about your learning goals or teaching background..."></textarea>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Phone Number (Optional)</label>
            <input type="text" id="phone" class="form-control" placeholder="+8801700000000">
          </div>
          <div class="form-group">
            <label class="form-label">Address (Optional)</label>
            <input type="text" id="address" class="form-control" placeholder="Dhaka, Bangladesh">
          </div>
        </div>

        <!-- Student Optional Fields -->
        <div id="studentFields">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label">Institution (Optional)</label>
              <input type="text" id="institution" class="form-control" placeholder="e.g. BUET">
            </div>
            <div class="form-group">
              <label class="form-label">Semester (Optional)</label>
              <input type="text" id="semester" class="form-control" placeholder="e.g. 5th Semester">
            </div>
          </div>
        </div>

        <!-- Teacher qualifications are required -->
        <div id="teacherFields" style="display:none;">
          <div class="form-group"><label class="form-label">Degree *</label><input id="teacherDegree" class="form-control" placeholder="e.g. MSc Computer Science"></div>
          <div class="form-group"><label class="form-label">Institute *</label><input id="teacherInstitute" class="form-control" placeholder="University or institute"></div>
          <div class="form-group"><label class="form-label">Experience *</label><input id="teacherExperience" class="form-control" placeholder="e.g. 5 years"></div>
          <div class="form-group"><label class="form-label">Certifications *</label><input id="teacherCertifications" class="form-control" placeholder="List certifications (or None)"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Create Account</button>
      </form>

      <div class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function toggleRoleFields(val) {
      document.getElementById('studentFields').style.display = val === 'student' ? 'block' : 'none';
      document.getElementById('teacherFields').style.display = val === 'teacher' ? 'block' : 'none';
      document.getElementById('bio').required = val === 'teacher';
      document.getElementById('teacherRequiredMark').textContent = val === 'teacher' ? '*' : '';
      ['teacherDegree','teacherInstitute','teacherExperience','teacherCertifications'].forEach(id => document.getElementById(id).required = val === 'teacher');
    }
  </script>
</body>
</html>
